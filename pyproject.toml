[project]
name = "personal-weather"
version = "0.1.0"
description = "A personal command-line weather tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencc-python-reimplemented>=0.1.7",
]

[project.scripts]
weather = "weather.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather"]
